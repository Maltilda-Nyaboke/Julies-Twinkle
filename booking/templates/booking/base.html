{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Barb Barbershop{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{% url 'home' %}" class="brand">Barb</a>
      <nav class="main-nav">
        <a href="{% url 'home' %}#about">About</a>
        <a href="{% url 'services' %}">Services</a>
        <a href="{% url 'products' %}">Products</a>
        <a href="{% url 'home' %}#contact">Contact</a>
      </nav>
      <a href="{% url 'booking' %}" class="button button--ghost">Book Now</a>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Barb Barbershop</p>
      <p>Style made simple.</p>
    </div>
  </footer>
</body>
</html>
